services:
  altegro:
    image: ${ALTEGRO_IMAGE:-altegro:local}
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "true"
      ALTEGRO_ENFORCE_HTTPS: "true"
      ALTEGRO_TRUST_PROXY: "true"
      ALTEGRO_ALLOWED_HOSTS: ${ALTEGRO_ALLOWED_HOSTS:-altegro.de,www.altegro.de}
      ALTEGRO_ALLOWED_ORIGINS: ${ALTEGRO_ALLOWED_ORIGINS:-https://altegro.de,https://www.altegro.de}
      ALTEGRO_PUBLIC_URL: ${ALTEGRO_PUBLIC_URL:-https://altegro.de}
      ALTEGRO_HSTS_ENABLED: "true"
      ALTEGRO_HSTS_MAX_AGE: "31536000"
      ALTEGRO_REQUIRE_MANAGED_SECRETS: "true"
      PGPASSWORD: ""
      PGPASSWORD_FILE: /run/secrets/altegro_postgres_password
      OBJECT_STORAGE_ACCESS_KEY: ""
      OBJECT_STORAGE_SECRET_KEY: ""
      OBJECT_STORAGE_ACCESS_KEY_FILE: /run/secrets/altegro_object_access_key
      OBJECT_STORAGE_SECRET_KEY_FILE: /run/secrets/altegro_object_secret_key
      OBJECT_STORAGE_CREATE_BUCKET: "false"
      AUTOXING_LIVE: "true"
      AUTOXING_REPO_PATH: /opt/autoxing
      AUTOXING_LIB_PATH: /opt/autoxing/lib
      AUTOXING_ENV_FILE: /run/altegro/autoxing.env
      APPID: ""
      APPSECRET: ""
      APPCODE: ""
      APPID_FILE: /run/secrets/autoxing_app_id
      APPSECRET_FILE: /run/secrets/autoxing_app_secret
      APPCODE_FILE: /run/secrets/autoxing_app_code
      CENOBOTS_LIVE: "true"
      CENOBOTS_HOST: ${CENOBOTS_HOST:-https://app-server-eu.cz-robots.com}
      CENOBOTS_ACCESS_KEY: ""
      CENOBOTS_SECRET_KEY: ""
      CENOBOTS_ROBOT_OPEN_ID: ${CENOBOTS_ROBOT_OPEN_ID:-}
      CENOBOTS_ROBOT_OPEN_IDS: ${CENOBOTS_ROBOT_OPEN_IDS:-}
      CENOBOTS_COMMANDS_ENABLED: ${CENOBOTS_COMMANDS_ENABLED:-false}
      CENOBOTS_ACCESS_KEY_FILE: /run/secrets/cenobots_access_key
      CENOBOTS_SECRET_KEY_FILE: /run/secrets/cenobots_secret_key
      CENOBOTS_WEBHOOK_SECRET_FILE: /run/secrets/cenobots_webhook_secret
      METRICS_TOKEN_FILE: /run/secrets/altegro_metrics_token
    secrets:
      - autoxing_app_id
      - autoxing_app_secret
      - autoxing_app_code
      - cenobots_access_key
      - cenobots_secret_key
      - cenobots_webhook_secret
      - altegro_metrics_token
      - altegro_postgres_password
      - altegro_object_access_key
      - altegro_object_secret_key
    volumes:
      - type: bind
        source: ${AUTOXING_REPO_HOST_PATH:-../autoxing}
        target: /opt/autoxing
        read_only: true

  frontend:
    image: ${ALTEGRO_FRONTEND_IMAGE:-altegro-frontend:local}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3001"
      ALTEGRO_API_ORIGIN: http://altegro:3000
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-}
      LEGAL_REPRESENTATIVE: ${LEGAL_REPRESENTATIVE:-}
      LEGAL_STREET: ${LEGAL_STREET:-}
      LEGAL_CITY: ${LEGAL_CITY:-}
      LEGAL_COUNTRY: ${LEGAL_COUNTRY:-Deutschland}
      LEGAL_EMAIL: ${LEGAL_EMAIL:-}
      LEGAL_PHONE: ${LEGAL_PHONE:-}
      LEGAL_REGISTER: ${LEGAL_REGISTER:-}
      LEGAL_VAT_ID: ${LEGAL_VAT_ID:-}
      LEGAL_CONTENT_RESPONSIBLE: ${LEGAL_CONTENT_RESPONSIBLE:-}
    depends_on:
      altegro:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  postgres:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/altegro_postgres_password
    secrets:
      - altegro_postgres_password

  minio:
    environment:
      MINIO_ROOT_USER: ""
      MINIO_ROOT_PASSWORD: ""
      MINIO_ROOT_USER_FILE: /run/secrets/altegro_object_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/altegro_object_secret_key
    secrets:
      - altegro_object_access_key
      - altegro_object_secret_key

secrets:
  autoxing_app_id:
    external: true
  autoxing_app_secret:
    external: true
  autoxing_app_code:
    external: true
  cenobots_access_key:
    external: true
  cenobots_secret_key:
    external: true
  cenobots_webhook_secret:
    external: true
  altegro_metrics_token:
    external: true
  altegro_postgres_password:
    external: true
  altegro_object_access_key:
    external: true
  altegro_object_secret_key:
    external: true
