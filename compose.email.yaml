services:
  altegro:
    environment:
      EMAIL_ALERTS_ENABLED: "true"
      EMAIL_ALERT_TRANSPORT: smtp
      EMAIL_ALERT_FROM: "${EMAIL_ALERT_FROM:?Set EMAIL_ALERT_FROM}"
      EMAIL_ALERT_RECIPIENTS: "${EMAIL_ALERT_RECIPIENTS:?Set EMAIL_ALERT_RECIPIENTS}"
      EMAIL_ALERT_MIN_SEVERITY: "${EMAIL_ALERT_MIN_SEVERITY:-error}"
      EMAIL_ALERT_COOLDOWN_MINUTES: "${EMAIL_ALERT_COOLDOWN_MINUTES:-60}"
      EMAIL_SMTP_HOST: "${EMAIL_SMTP_HOST:?Set EMAIL_SMTP_HOST}"
      EMAIL_SMTP_PORT: "${EMAIL_SMTP_PORT:-465}"
      EMAIL_SMTP_SECURE: "${EMAIL_SMTP_SECURE:-true}"
      EMAIL_SMTP_USERNAME: "${EMAIL_SMTP_USERNAME:?Set EMAIL_SMTP_USERNAME}"
      EMAIL_SMTP_PASSWORD_FILE: /run/secrets/altegro_smtp_password
      SMS_ALERTS_ENABLED: "true"
      SMS_ALERT_TRANSPORT: webhook
      SMS_ALERT_RECIPIENTS: "${SMS_ALERT_RECIPIENTS:?Set SMS_ALERT_RECIPIENTS in E.164 format}"
      SMS_ALERT_MIN_SEVERITY: "${SMS_ALERT_MIN_SEVERITY:-critical}"
      SMS_ALERT_COOLDOWN_MINUTES: "${SMS_ALERT_COOLDOWN_MINUTES:-60}"
      SMS_ALERT_WEBHOOK_URL: "${SMS_ALERT_WEBHOOK_URL:?Set the HTTPS SMS provider webhook URL}"
      SMS_ALERT_WEBHOOK_TOKEN_FILE: /run/secrets/altegro_sms_webhook_token
      SMS_ALERT_TIMEOUT_MS: "${SMS_ALERT_TIMEOUT_MS:-10000}"
      ALTEGRO_PUBLIC_URL: "${ALTEGRO_PUBLIC_URL:-https://altegro.de}"
    secrets:
      - altegro_smtp_password
      - altegro_sms_webhook_token

secrets:
  altegro_smtp_password:
    external: true
  altegro_sms_webhook_token:
    external: true
