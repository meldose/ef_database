global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: altegro
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/altegro_metrics_token
    static_configs:
      - targets: ["altegro:3000"]
